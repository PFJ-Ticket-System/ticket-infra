[databases]
; Single entry covers all schemas; each service sets Search Path in its own connection string.
ticket = host=postgres port=5432 dbname=ticket

[pgbouncer]
listen_addr = *
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling — connection returned to pool at end of every transaction.
; Incompatible with LISTEN/NOTIFY, advisory locks, and session-level SET; use a
; direct Postgres connection (PostgresDirect connection string) for those features.
pool_mode = transaction

; Pool size per database+user pair.
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
max_client_conn = 1000

; Required for Npgsql transaction-pooling compatibility.
server_reset_query =
server_reset_query_always = 0

; Suppress noisy extra_float_digits sent by drivers.
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0
