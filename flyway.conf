# Flyway configuration for ticket-system
# Points directly at Postgres (not PgBouncer) since migrations require a session-level connection.
flyway.url=jdbc:postgresql://postgres:5432/ticket
flyway.user=ticket
flyway.password=${TICKET_DB_PASSWORD}
flyway.schemas=events,orders,payments
flyway.locations=filesystem:/flyway/sql
flyway.connectRetries=10
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true
